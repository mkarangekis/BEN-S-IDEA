apiVersion: apps/v1
kind: Deployment
metadata:
  name: provenance-backend
  labels:
    app: provenance-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: provenance-backend
  template:
    metadata:
      labels:
        app: provenance-backend
    spec:
      containers:
        - name: backend
          image: provenance-pulse/backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: provenance-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: provenance-config
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: provenance-secrets
                  key: jwt-secret
            - name: ML_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: provenance-config
                  key: ml-service-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: provenance-backend
spec:
  selector:
    app: provenance-backend
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
